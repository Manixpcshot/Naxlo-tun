<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Naxlo mark v2 — "the protected tunnel": a geometric N drawn as a light
    beam between two nodes, framed by a shield and triple orbit rings with
    satellites, over a dot-matrix constellation on a near-black tile.
    Master source for every raster/icon artefact (see scripts/make-icons.mjs).
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1018"/>
      <stop offset="0.5" stop-color="#07090d"/>
      <stop offset="1" stop-color="#04050a"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetTint" cx="1" cy="1" r="0.9">
      <stop offset="0" stop-color="#9b8cfb" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#9b8cfb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#7deaf7" fill-opacity="0.055"/>
    </pattern>
    <linearGradient id="beam" x1="172" y1="146" x2="340" y2="366" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="shieldStroke" x1="256" y1="112" x2="256" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7deaf7" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="shieldFill" cx="0.5" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.012"/>
    </radialGradient>
    <radialGradient id="node" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4feff"/>
      <stop offset="0.45" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.62" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft8" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="8" y="8" width="496" height="496" rx="116"/>
    </clipPath>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#tile)" stroke="#7deaf7" stroke-opacity="0.16" stroke-width="2"/>

  <g clip-path="url(#tileClip)">
    <!-- atmosphere -->
    <rect x="8" y="8" width="496" height="300" fill="url(#sheen)"/>
    <rect x="8" y="8" width="496" height="496" fill="url(#violetTint)"/>
    <rect x="8" y="8" width="496" height="496" fill="url(#dots)"/>

    <!-- constellations -->
    <g stroke="#a5f3fc" stroke-opacity="0.14" stroke-width="1.4" fill="none">
      <path d="M78 132 L112 92 L150 108"/>
      <path d="M436 382 L412 428 L458 442"/>
    </g>
    <g fill="#eafcff">
      <circle cx="78" cy="132" r="2.6" opacity="0.5"/>
      <circle cx="112" cy="92" r="2" opacity="0.38"/>
      <circle cx="150" cy="108" r="1.7" opacity="0.3"/>
      <circle cx="436" cy="382" r="2.4" opacity="0.42"/>
      <circle cx="412" cy="428" r="1.8" opacity="0.32"/>
      <circle cx="458" cy="442" r="1.5" opacity="0.26"/>
      <circle cx="96" cy="330" r="1.6" opacity="0.22"/>
      <circle cx="424" cy="140" r="1.8" opacity="0.24"/>
    </g>

    <!-- orbit rings -->
    <circle cx="256" cy="256" r="152" fill="none" stroke="#7deaf7" stroke-opacity="0.17" stroke-width="2"/>
    <circle cx="256" cy="256" r="184" fill="none" stroke="#7deaf7" stroke-opacity="0.085" stroke-width="2" stroke-dasharray="1 9" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="214" fill="none" stroke="#7deaf7" stroke-opacity="0.05" stroke-width="1.5"/>
    <!-- ring ticks -->
    <g stroke="#7deaf7" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round">
      <path d="M402 256 H414"/><path d="M98 256 H110"/><path d="M256 104 V116"/><path d="M256 396 V408"/>
    </g>
    <!-- satellites -->
    <circle cx="348" cy="97" r="9" fill="#22d3ee" opacity="0.3" filter="url(#soft8)"/>
    <circle cx="348" cy="97" r="4.6" fill="#eafcff" opacity="0.85"/>
    <circle cx="71" cy="363" r="6" fill="#22d3ee" opacity="0.2" filter="url(#soft8)"/>
    <circle cx="71" cy="363" r="3.4" fill="#a5f3fc" opacity="0.55"/>

    <!-- shield -->
    <path d="M256 112 L378 156 V256 C378 336 324 390 256 412 C188 390 134 336 134 256 V156 Z" fill="url(#shieldFill)"/>
    <path d="M256 112 L378 156 V256 C378 336 324 390 256 412 C188 390 134 336 134 256 V156 Z" fill="none" stroke="#22d3ee" stroke-opacity="0.14" stroke-width="16" filter="url(#soft)"/>
    <path d="M256 112 L378 156 V256 C378 336 324 390 256 412 C188 390 134 336 134 256 V156 Z" fill="none" stroke="url(#shieldStroke)" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- grounding shadow -->
    <ellipse cx="256" cy="402" rx="112" ry="20" fill="#000000" opacity="0.5" filter="url(#soft)"/>

    <!-- halo behind the beam -->
    <path d="M172 360 V152 L340 360 V152" fill="none" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="58" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>

    <!-- the N -->
    <path d="M172 360 V152 L340 360 V152" fill="none" stroke="url(#beam)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- data particles travelling the beam -->
    <g>
      <circle cx="222" cy="214" r="8" fill="#a5f3fc" opacity="0.28" filter="url(#soft8)"/>
      <circle cx="222" cy="214" r="3.4" fill="#ffffff" opacity="0.8"/>
      <circle cx="264" cy="266" r="9.5" fill="#a5f3fc" opacity="0.3" filter="url(#soft8)"/>
      <circle cx="264" cy="266" r="4.4" fill="#ffffff" opacity="0.92"/>
      <circle cx="298" cy="308" r="7" fill="#a5f3fc" opacity="0.24" filter="url(#soft8)"/>
      <circle cx="298" cy="308" r="2.9" fill="#ffffff" opacity="0.68"/>
      <circle cx="172" cy="298" r="2.7" fill="#eafcff" opacity="0.5"/>
      <circle cx="340" cy="222" r="2.7" fill="#eafcff" opacity="0.5"/>
    </g>

    <!-- light entering / leaving the tunnel -->
    <g stroke="#a5f3fc" stroke-opacity="0.3" stroke-width="2.6" stroke-linecap="round">
      <path d="M146 126 L128 108"/><path d="M138 152 H114"/>
      <path d="M366 386 L384 404"/><path d="M374 360 H398"/>
    </g>
    <circle cx="172" cy="152" r="36" fill="url(#node)" opacity="0.9"/>
    <circle cx="340" cy="360" r="36" fill="url(#node)" opacity="0.9"/>
    <circle cx="172" cy="152" r="21.5" fill="none" stroke="#a5f3fc" stroke-opacity="0.4" stroke-width="2"/>
    <circle cx="340" cy="360" r="21.5" fill="none" stroke="#a5f3fc" stroke-opacity="0.4" stroke-width="2"/>
    <circle cx="172" cy="152" r="12" fill="#f2feff"/>
    <circle cx="340" cy="360" r="12" fill="#f2feff"/>

    <rect x="8" y="8" width="496" height="496" fill="url(#vig)"/>
  </g>

  <!-- premium double hairline -->
  <rect x="19" y="19" width="474" height="474" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
  <rect x="27" y="27" width="458" height="458" rx="99" fill="none" stroke="#7deaf7" stroke-opacity="0.05" stroke-width="1.4"/>
</svg>
