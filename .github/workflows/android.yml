name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch libv2ray.aar (Xray-core bound with gomobile)
        run: |
          mkdir -p android/app/libs
          curl -sL -o android/app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.10/libv2ray.aar
          ls -la android/app/libs

      - name: Fetch geo routing assets
        run: |
          mkdir -p android/app/assets
          curl -sL -o android/app/assets/geoip.dat https://github.com/v2fly/geoip/releases/latest/download/geoip.dat
          curl -sL -o android/app/assets/geosite.dat https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat
          ls -la android/app/assets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: |
          set -o pipefail
          cd android && gradle testDebugUnitTest --no-daemon --console=plain 2>&1 | tee build.log

      - name: Assemble debug APK
        if: always()
        run: |
          set -o pipefail
          cd android && gradle assembleDebug --no-daemon --console=plain 2>&1 | tee -a build.log

      - name: Assemble release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -o pipefail
          cd android && gradle assembleRelease --no-daemon --console=plain 2>&1 | tee -a build.log

      - name: Post build log tail
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          cd android
          if [ -f build.log ]; then
            tail -c 5000 build.log > tail.txt
            cat tail.txt >> "$GITHUB_STEP_SUMMARY"
            PR=$(gh pr view --json number -q .number || true)
            if [ -n "$PR" ]; then
              gh pr comment "$PR" --body-file tail.txt || true
            fi
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -f body=@"tail.txt" || true
          fi

      - name: Publish build log to ci-logs branch
        if: always()
        run: |
          cd android
          if [ -f build.log ]; then
            git config user.name naxlo-ci
            git config user.email ci@users.noreply.github.com
            git fetch origin ci-logs || true
            git checkout -B ci-logs origin/ci-logs 2>/dev/null || git checkout -b ci-logs
            cp build.log android-build.log
            git add android-build.log
            git commit -m "ci: android build log for ${GITHUB_SHA}" || true
            git push -f origin ci-logs || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: naxlo-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APKs to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "Naxlo-android-${TAG}-debug.apk"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "Naxlo-android-${TAG}-unsigned.apk"
          gh release upload "$TAG" "Naxlo-android-${TAG}-debug.apk" "Naxlo-android-${TAG}-unsigned.apk" --clobber
