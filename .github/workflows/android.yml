name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch libv2ray.aar (Xray-core bound with gomobile)
        run: |
          mkdir -p android/app/libs
          # -f so a 404 fails the step instead of writing an HTML error page
          curl -fsSL -o android/app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.10/libv2ray.aar
          # an AAR is a zip: verify the magic bytes and a sane size
          test "$(head -c 2 android/app/libs/libv2ray.aar)" = "PK" || { echo "libv2ray.aar is not a zip archive"; exit 1; }
          SIZE=$(stat -c %s android/app/libs/libv2ray.aar)
          test "$SIZE" -gt 1000000 || { echo "libv2ray.aar is suspiciously small: $SIZE bytes"; exit 1; }
          ls -la android/app/libs

      - name: Fetch geo routing assets (optional)
        run: |
          mkdir -p android/app/assets
          # Routing keeps private traffic direct with explicit CIDRs, so these
          # assets are a bonus, not a requirement: verify them and drop any
          # truncated/error body instead of shipping a bogus .dat file.
          fetch_dat() {
            url="$1"; out="$2"
            if curl -fsSL -o "$out" "$url"; then
              size=$(stat -c %s "$out")
              if [ "$size" -gt 100000 ]; then
                echo "ok: $out ($size bytes)"
              else
                echo "warning: $out is only $size bytes — dropping it"
                rm -f "$out"
              fi
            else
              echo "warning: could not fetch $out — continuing without it"
              rm -f "$out"
            fi
          }
          fetch_dat https://github.com/v2fly/geoip/releases/latest/download/geoip.dat android/app/assets/geoip.dat
          fetch_dat https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat android/app/assets/geosite.dat
          ls -la android/app/assets || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build and diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          T="$RUNNER_TEMP"
          cd "$GITHUB_WORKSPACE/android"
          { echo "== pwd: $(pwd)"; gradle --version 2>&1 | head -6; } > "$T/head.txt"
          gradle testDebugUnitTest --no-daemon --console=plain > "$T/test.log" 2>&1; RC1=$?
          gradle assembleDebug --no-daemon --console=plain > "$T/dbg.log" 2>&1; RC2=$?
          RC3=0
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gradle assembleRelease --no-daemon --console=plain > "$T/rel.log" 2>&1; RC3=$?
          fi
          {
            cat "$T/head.txt"
            echo "== testDebugUnitTest (rc=$RC1):"
            tail -c 7000 "$T/test.log"
            echo "== assembleDebug (rc=$RC2):"
            tail -c 7000 "$T/dbg.log"
            if [ $RC3 -ne 0 ] || [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "== assembleRelease (rc=$RC3):"
              tail -c 7000 "$T/rel.log"
            fi
          } > "$T/diag.txt" 2>&1
          RC=$((RC1+RC2+RC3))
          if [ $RC -ne 0 ]; then
            tail -c 12000 "$T/diag.txt" > diag-tail.txt
            B64=$(base64 -w0 diag-tail.txt)
            SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/android-build.log?ref=ci-logs" --jq .sha 2>/dev/null || true)
            if [ -n "$SHA" ]; then
              gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/android-build.log" -f message="ci: android diag ${GITHUB_SHA}" -f content="$B64" -f branch=ci-logs -f sha="$SHA" >/dev/null || true
            else
              gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/android-build.log" -f message="ci: android diag ${GITHUB_SHA}" -f content="$B64" -f branch=ci-logs >/dev/null || true
            fi
            exit 1
          fi
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: naxlo-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APKs to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "Naxlo-android-${TAG}-debug.apk"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "Naxlo-android-${TAG}-unsigned.apk"
          gh release upload "$TAG" "Naxlo-android-${TAG}-debug.apk" "Naxlo-android-${TAG}-unsigned.apk" --clobber
