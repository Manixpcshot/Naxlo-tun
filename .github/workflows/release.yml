name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (parser + config builder + redactor)
        run: npm test

      - name: Fetch Xray core (bundled, checksum-verified)
        run: node scripts/fetch-xray.mjs --platform win32 --arch x64

      - name: Build app
        run: npm run build

      - name: Package installers
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List artifacts
        shell: bash
        run: ls -la release || true

      - name: Publish release with assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="RELEASE_NOTES.md"
          if [ ! -f "$NOTES" ]; then NOTES="CHANGELOG.md"; fi
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Naxlo ${TAG}" \
              --notes-file "$NOTES" \
              --draft=false --prerelease=false
          fi
          gh release upload "$TAG" release/*.exe release/latest.yml --clobber

  checksums:
    name: Publish SHA-256 checksums
    runs-on: ubuntu-latest
    needs: build-windows
    timeout-minutes: 15
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p assets
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir assets --pattern '*.exe'

      - name: Write checksums and attach
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd assets
          sha256sum *.exe > SHA256SUMS.txt
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber
