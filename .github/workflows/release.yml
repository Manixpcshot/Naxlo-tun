name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (parser + config builder + redactor)
        run: npm test

      - name: Fetch Xray core (bundled, checksum-verified)
        run: node scripts/fetch-xray.mjs --platform win32 --arch x64

      - name: Build app
        run: npm run build

      - name: Package installers
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List artifacts
        shell: bash
        run: ls -la release || true

      - name: Publish release with assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="RELEASE_NOTES.md"
          if [ ! -f "$NOTES" ]; then NOTES="CHANGELOG.md"; fi
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Naxlo ${TAG}" \
              --notes-file "$NOTES" \
              --draft=false --prerelease=false
          fi
          # uploads.github.com hiccups from time to time; one failed attempt
          # must not cost the whole release, so retry before giving up.
          for attempt in 1 2 3 4 5 6; do
            if gh release upload "$TAG" release/*.exe release/latest.yml --clobber; then
              exit 0
            fi
            echo "asset upload failed (attempt ${attempt}/6) — retrying in 20s"
            sleep 20
          done
          exit 1

  website-zip:
    name: Attach website deployment zip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip the static site (cPanel-ready, hidden files included)
        run: |
          cd website
          zip -r ../naxlo-website.zip .
          cd ..
          ls -la naxlo-website.zip

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This job finishes seconds after the tag push, so it can reach the
          # upload before the release exists — and uploads.github.com drops
          # connections occasionally. Retry instead of failing the release.
          for attempt in 1 2 3 4 5 6 7 8 9; do
            if gh release upload "${GITHUB_REF_NAME}" naxlo-website.zip --repo "${GITHUB_REPOSITORY}" --clobber; then
              exit 0
            fi
            echo "website zip upload failed (attempt ${attempt}/9) — retrying in 20s"
            sleep 20
          done
          exit 1

  checksums:
    name: Publish SHA-256 checksums
    runs-on: ubuntu-latest
    needs: build-windows
    timeout-minutes: 15
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p assets
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir assets --pattern '*.exe'

      - name: Write checksums and attach
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd assets
          sha256sum *.exe > SHA256SUMS.txt
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber
