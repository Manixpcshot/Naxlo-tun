[package]
name = "naxlo"
version = "1.8.0"
description = "Naxlo — Persian VLESS client (Rust edition)"
authors = ["Manixpcshot"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "naxlo_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream"] }
tokio = { version = "1", features = ["net", "time", "process", "io-util", "macros", "rt", "rt-multi-thread", "sync"] }
futures-util = "0.3"
base64 = "0.22"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
aes-gcm = "0.10"
getrandom = "0.2"
percent-encoding = "2"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
